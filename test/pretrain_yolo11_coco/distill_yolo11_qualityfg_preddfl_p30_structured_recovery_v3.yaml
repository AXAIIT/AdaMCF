    map50_95: 0.36020353402151445

# QualityFG 是预测级 KD 的选点/加权组件，不含 Neck projector 或其他特征蒸馏分支。
qualityfg_mask:
  contract: "gt_inside_teacher_cls_times_decoded_dfl_iou_per_gt_cross_scale_topk_v2"
  selection_mode: "quality_fg_v2"
  quality_topk_per_gt: 15
  quality_weight: "per_gt_topk_q_normalized_to_sum_K_overlap_uses_max"
  q_definition: "max_class_sigmoid_score * decoded_DFL_box_iou_to_GT"
  tiny_gt_fallback: "nearest_P3_center_with_explicit_counter"
  gradients: "no_gradient_through_teacher_or_mask"

prediction_kd:
  cls_weight: 0.5
  dfl_weight: 0.25
  cls_temperature: 2.0
  dfl_temperature: 2.0
  kd_warmup_epochs: 5
  confidence_threshold_unused_in_v3: 0.10
  topk_per_image_unused_in_v3: 100
  loss: "L_det + warmup*(0.5*L_clsKD + 0.25*L_dflKD)*batch_size"

admission:
  run_epochs: 1
  requirement: "QualityFG unit/parity pass + first_nonzero_KD_optimizer_step + frozen_teacher + pure_student_checkpoint + physical_structure_unchanged"
  observed_run_id: "20260728_yolo11n_p30_structured_recovery_qualityfg_kd_admission_e1_v1"
  result: "pass; teacher_gradients=0, student_kd_gradients=255/255, pure_checkpoint=true, structure_and_fixed_forward=true"
short_paired_screen:
  run_epochs: 20
  quality_gate_primary: "KD_minus_control_map50_95 >= +0.30pp"
  control: "same structured source/data/seed/optimizer/lr/epochs/batch/augmentation; KD losses disabled"
  kd: "only Prediction KD plus QualityFG mask enabled"
formal_validation:
  run_epochs: 80
  prerequisite: "short_paired_screen passes; current result does not pass, so this stage is not authorized"
  additional_requirement: "at_least_3_seeds_after_the_first_80epoch_pair"

# lr0=0.001 复制 P30 历史普通恢复的已验证训练合同；不是为 KD 任意提高学习率。
