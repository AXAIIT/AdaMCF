# 诊断样本中 A1 平均选择 109.53 点/图、平均 7.26 GT/图，K=15 使 A2 的原始
# 选择预算约为 109 点/图；它是受控起点，不是已经验证的最优超参数。
qualityfg_mask:
  contract: "gt_inside_teacher_cls_times_decoded_dfl_iou_per_gt_cross_scale_topk_v2"
  selection_mode: "quality_fg_v2"
  quality_topk_per_gt: 15
  quality_weight: "per_gt_topk_q_normalized_to_sum_K_overlap_uses_max"
  q_definition: "max_class_sigmoid_score * decoded_DFL_box_iou_to_GT"
  tiny_gt_fallback: "nearest_P3_center_with_explicit_counter"
  gradients: "no_gradient_through_teacher_or_mask"

prediction_kd:
  cls_weight: 0.5
  dfl_weight: 0.25
  cls_temperature: 2.0
  dfl_temperature: 2.0
  kd_warmup_epochs: 5
  # 保留为命令兼容字段；quality_fg_v2 不使用 A1 的全图阈值 / 每图 Top-K。
  confidence_threshold_unused_in_v2: 0.10
  topk_per_image_unused_in_v2: 100
  loss: "L_det + warmup*(0.5*L_clsKD + 0.25*L_dflKD)*batch_size"

admission:
  run_epochs: 1
  requirement: "QualityFG mask unit test + first_nonzero_KD_optimizer_step + frozen_teacher + pure_student_checkpoint"
short_paired_screen:
  run_epochs: 20
  quality_gate_primary: "KD_minus_control_map50_95 >= +0.30pp"
  control: "same source/data/seed/optimizer/lr/epochs/batch/augmentation; KD losses disabled"
  kd: "only KD loss and QualityFG mask enabled"
formal_validation:
  run_epochs: 80
  prerequisite: "short_paired_screen passes"
  additional_requirement: "at_least_3_seeds"

training_contract:
  imgsz: 640
  batch: 64
  workers: 12
  optimizer: "SGD"
  lr0: 0.0005
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 0
  close_mosaic: 20
  amp: false
